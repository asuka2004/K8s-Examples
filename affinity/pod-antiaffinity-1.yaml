apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti-1
  namespace: prod
spec:
  selector:
    matchLabels:
      app: store
  replicas: 4 
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
      - name: redis-server
        image: redis:3.2-alpine
      affinity:
        podAntiAffinity: 
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: 
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - store
              topologyKey:  "zone"        
