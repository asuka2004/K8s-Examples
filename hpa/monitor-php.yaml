apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  creationTimestamp: null
  name: php-apache
  namespace: test
spec:
  maxReplicas: 10
  minReplicas: 1
  scaleTargetRef:  
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache  ## Pod limit: 100m  
  targetCPUUtilizationPercentage: 20  
