apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-v1
  namespace: prod
  labels:
    app: canary-nginx
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: canary-nginx
      version: v1
  template:
    metadata:
      labels:
        app: canary-nginx
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.20       
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-v2
  namespace: prod
  labels:
    app: canary-nginx
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-nginx
      version: v2
  template:
    metadata:
      labels:
        app: canary-nginx
        version: v2
    spec:
      containers:
      - name: nginx
        image: nginx:1.25       
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: canary-svc
  namespace: prod
spec:
  selector:
    app: canary-nginx           
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 31888
    protocol: TCP
