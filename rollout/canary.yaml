# Canary 金丝雀部署 - 模拟滚动升级
# 流量分配：v1 (稳定版) 80% / v2 (金丝雀) 20%
# v1 稳定版 Deployment（4个副本 = 80%流量）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-v1
  namespace: test
  labels:
    app: canary-nginx
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: canary-nginx
      version: v1
  template:
    metadata:
      labels:
        app: canary-nginx
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.20       # 稳定版本
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
# v2 金丝雀版 Deployment（1个副本 = 20%流量）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-v2
  namespace: test
  labels:
    app: canary-nginx
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-nginx
      version: v2
  template:
    metadata:
      labels:
        app: canary-nginx
        version: v2
    spec:
      containers:
      - name: nginx
        image: nginx:1.25       # 新版本（金丝雀）
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
# Service：同时选中 v1 和 v2（只用 app 标签，不区分 version）
# 流量按副本数比例自动分配 4:1 = 80%:20%
apiVersion: v1
kind: Service
metadata:
  name: canary-svc
  namespace: test
spec:
  selector:
    app: canary-nginx           # 同时匹配 v1 和 v2
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 31888
    protocol: TCP
