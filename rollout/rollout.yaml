apiVersion: apps/v1  ### 
kind: Deployment  ## 
metadata:
  name:  test-rollout   
  namespace: test
  labels:
    dep:  test-04
spec:
  strategy:
    # type: Recreate   
    type: RollingUpdate
    rollingUpdate: 
      maxUnavailable: 2
      maxSurge: 20%
  replicas: 20
  selector:   #
    matchLabels:  #
      pod-name:  test-rollout  #
  template:
    metadata:  ### pod的metadata
      labels:
        pod-name:  test-rollout
    spec:
      containers:
      - name:  nginx
        image:  nginx:1.22-alpine
