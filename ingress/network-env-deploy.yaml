apiVersion: v1
kind: Service
metadata:
  name: svc-net
  namespace: prod
spec:
  selector:
    app: net-rule
  type: NodePort             # 
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
    #nodePort: 80          # 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-rule-1
  namespace: prod
  labels:
    app: net-rule
spec:
  replicas: 3
  selector:
    matchLabels:
      app: net-rule
  template:
    metadata:
      labels:
        app: net-rule
    spec:
      containers:
      - name: nginx
        image: nginx:1.20.0-alpine
        ports:
        - containerPort: 80

