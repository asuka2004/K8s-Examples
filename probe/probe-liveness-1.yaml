apiVersion: v1
kind: Pod
metadata:
  name: "probe-liveness-1"
  namespace: test
  labels:
    app: "probe-liveness-1"
spec:
  volumes:
  - name: nginx-html
    hostPath: 
      path: /tmp
  containers:
  - name: nginx
    image: "nginx"
    ports:
    - containerPort: 80
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
    livenessProbe:   ## 
      httpGet:
        path: /abc.html
        port: 80
        scheme: HTTP
      periodSeconds: 1  ##
      successThreshold: 1 
      failureThreshold: 2 

    
