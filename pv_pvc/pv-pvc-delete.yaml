apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-pvc-delete
  labels:
    type: local
spec:
  persistentVolumeReclaimPolicy: Delete # 
  storageClassName: nfs-storage
  capacity:
    storage: 10Mi
  accessModes:
  - ReadWriteOnce
  nfs: ## 使用nfs存储系统
    server: 192.168.88.60 ## 没type
    path: /nfs/data/pv-pvc-delete ### abc文件夹提前创建

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-pvc-delete
  namespace: test
  labels:
    app: pv-pvc
spec:
  storageClassName: nfs-storage
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Mi 

