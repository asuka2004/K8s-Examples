apiVersion: v1
kind: Pod
metadata:
  name: pod
  namespace: prod 
  labels:
    app: "pvc-nginx"
spec:
  restartPolicy: Always       
  containers:
  - name: pvc-pod
    image: "nginx"
    ports:
    - containerPort: 80
      name: http
    volumeMounts:
    - name: localtime
      mountPath: /etc/localtime
    - name: html
      mountPath: /usr/share/nginx/html/
        #type: DirectoryOrCreate
  volumes:
  - name: localtime
    hostPath:
      path: /usr/share/zoneinfo/Asia/Shanghai
  - name: html
    persistentVolumeClaim:
       claimName: pvc-10m
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-10m
  namespace: prod
  labels:
    app: "pvc-nginx"
spec:
  storageClassName: nfs-storage #
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi

