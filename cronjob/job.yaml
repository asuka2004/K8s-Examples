apiVersion: batch/v1
kind: Job
metadata:
  namespace: prod
  name: job
spec:
  completions: 7  
  parallelism: 2
  template:
    spec:
      containers:
      - name: ping-job
        image: busybox  
        command: ["/bin/sh","-c","ping -c 3 8.8.8.8"]
      restartPolicy: Never 
  # backoffLimit: 4 
  activeDeadlineSeconds: 600   
  ttlSecondsAfterFinished: 30  
