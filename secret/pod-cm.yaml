apiVersion: v1
kind: ConfigMap
metadata:
  name: test-configmap
  namespace: prod
data:
  player_initial_lives: "3"
  ui_properties_file_name: "user-interface.properties"
  game.properties: |
    enemy.types=aliens,monsters
    player.maximum-lives=5
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
---
apiVersion: v1
kind: Pod
metadata:
  name: cm
  namespace: prod 
  labels:
    app: cm
spec:
  volumes:
  - name: cm
    configMap:
      name: test-configmap
  containers:
  - name: pod-cm
    image: "busybox"
    command: ["/bin/sh","-c","sleep 36000"]
    env:
    - name: PLAY_LIVES
      valueFrom:
        configMapKeyRef: #
          name: test-configmap
          key: player_initial_lives
    volumeMounts:
    - name: cm
      mountPath: /app
      readOnly: true 
