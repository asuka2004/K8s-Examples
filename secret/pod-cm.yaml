apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: test
data:
  # 类属性键；每一个键都映射到一个简单的值
  player_initial_lives: "3"
  ui_properties_file_name: "user-interface.properties"
  # 类文件键
  game.properties: |
    enemy.types=aliens,monsters
    player.maximum-lives=5
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-cm
  namespace: test 
  labels:
    app: cm
spec:
  volumes:
  - name: cm
    configMap:
      name: configmap
  containers:
  - name: pod-cm
    image: "busybox"
    command: ["/bin/sh","-c","sleep 36000"]
    env:
    - name: PLAY_LIVES
      valueFrom:
        configMapKeyRef: ##来自于cm
          name: configmap
          key: player_initial_lives
    volumeMounts:
    - name: cm
      mountPath: /app
      readOnly: true 
