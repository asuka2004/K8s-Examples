apiVersion: v1
kind: Pod
metadata:
  name: "pod-mount-time-2"
  namespace: test 
  labels:
    app: "pod-mount-time"
spec:
  containers:
  - name: pod-mount-time
    image: "nginx"
    ports:
    - containerPort: 80
      name: http
    volumeMounts:
    - name: localtime
      mountPath: /etc/localtime
    - name: html
      mountPath: /usr/share/nginx/html/
  volumes:
  - name: localtime
    hostPath:
      path: /usr/share/zoneinfo/Asia/Taipei
      type: File
  - name: html
    nfs: #
      server: 192.168.88.60
      path: /nfs/data/nginx/
