apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeport
  namespace: prod
  labels:
    app: cluster
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster
  template:
    metadata:
      labels:
        app: cluster
    spec:
      containers:
      - name: nginx
        image: nginx:1.20.0-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  namespace: prod
spec:
  selector:
    app: cluster
  type: NodePort        #
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 31110     #
