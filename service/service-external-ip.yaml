apiVersion: v1
kind: Service
metadata:
  name: externalip
  namespace: test
spec:
  selector:
    app: cluster
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80  
  externalIPs: 
    - 192.168.88.100   
