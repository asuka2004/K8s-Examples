apiVersion: apps/v1 ###
kind: Deployment ##
metadata:
  name:  service-pod   #
  namespace: prod
  labels:
    dep:  test
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 20
  replicas: 3
  selector:   #
    matchLabels:   #
      app: cluster
  template:
    metadata:   ### pod的metadata
      labels:
        app: cluster
    spec:
      containers:
      - name:  nginx
        image:  nginx:1.20.0-alpine

