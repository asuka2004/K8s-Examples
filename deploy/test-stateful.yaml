apiVersion: apps/v1
kind: StatefulSet  
metadata:
  name: svc-stateful
  namespace: test
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: svc-stateful # has to match .spec.template.metadata.labels
  serviceName: "svc-stateful"  
  replicas: 3 
  template: 
    metadata:
      labels:
        app: svc-stateful # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: nginx
        image: nginx:1.20.0-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: svc-stateful  
  namespace: test
spec:
  selector:
    app: svc-stateful
  clusterIP: None  
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
