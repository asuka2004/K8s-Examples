apiVersion: apps/v1
kind: StatefulSet  ### 有状态副本集
metadata:
  name: svc-stateful
  namespace: test
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: svc-stateful # has to match .spec.template.metadata.labels
  serviceName: "svc-stateful"  ## 服务名，指定加到那个service里面
  replicas: 3 # 三个副本
  template: ## Pod模板
    metadata:
      labels:
        app: svc-stateful # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: nginx
        image: nginx:1.20.0-alpine
---
## 加网络
apiVersion: v1
kind: Service
metadata:
  name: svc-stateful  ## 和上面的serviceName
  namespace: test
spec:
  selector:
    app: svc-stateful
  clusterIP: None  ## 不要分配ClusterIP,headless service，整个集群的Pod能直接访问
  # 浏览器目前不能访问，mysql\mq。继续使用ingress网络定义所有的访问逻辑
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
