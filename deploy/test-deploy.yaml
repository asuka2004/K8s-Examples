apiVersion: apps/v1 ###
kind: Deployment ##
metadata:
  name:  test-deploy   ### 遵循域名編寫規範
  namespace: test 
  labels:
    #dep:  test-01
    app: cluster
### 期望狀態
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 20
  replicas: 20 
  selector:   ### 選擇器
    matchLabels:   ### 匹配標籤
      #pod-name: nginx-01 ### 和模板template裡面的pod的標籤必須一樣
      app: cluster
  template:
    metadata:   ### pod的metadata
      labels:
        #pod-name: nginx-01
        app: cluster
    spec:
      containers:
      - name:  nginx
        image:  nginx:1.20.0-alpine

